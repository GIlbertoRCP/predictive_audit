[project]
name = "predictive-audit"
version = "0.2.0"
description = "Check whether a time-series forecasting result actually beats trivial baselines."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Gilberto Romero-Cano" }]
keywords = ["time-series", "forecasting", "evaluation", "mlops", "bootstrap", "leakage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/GIlbertoRCP/predictive_audit"
Repository = "https://github.com/GIlbertoRCP/predictive_audit"
Issues = "https://github.com/GIlbertoRCP/predictive_audit/issues"

[project.scripts]
predictive-audit = "predictive_audit.cli:main"

[dependency-groups]
cases = [
    "h5py>=3.16.0",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
predictive_audit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["predictive_audit"]
branch = true

[tool.coverage.report]
show_missing = true
