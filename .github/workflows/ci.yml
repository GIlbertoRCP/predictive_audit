name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dev dependencies (builds the native extension)
        run: uv sync --group dev
      - name: Lint with ruff
        run: uv run ruff check src tests benchmarks
      - name: Type-check with mypy
        run: uv run mypy src
      - name: Check C++ formatting
        run: find native \( -name '*.cpp' -o -name '*.hpp' \) | xargs uvx clang-format==19.1.7 --dry-run --Werror

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (builds the native extension)
        run: uv sync --group dev
      - name: Test suite on the native backend, with coverage
        env:
          PREDICTIVE_AUDIT_BACKEND: native
        run: uv run pytest --cov=predictive_audit --cov-report=term-missing --cov-fail-under=90
      - name: Test suite on the pure-Python reference backend
        env:
          PREDICTIVE_AUDIT_BACKEND: python
        run: uv run pytest -q
      - name: Smoke-test Case 01
        if: matrix.python-version == '3.12'
        run: uv run python cases/01_predictive_activation_lstm/run.py

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release -DPAUDIT_WERROR=ON
      - name: Build
        run: cmake --build build/native --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Run the standalone binary
        shell: bash
        run: |
          bin=$(find build/native -type f \( -name predictive-audit -o -name predictive-audit.exe \) | head -n1)
          "$bin" --version
          "$bin" --build-info
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Golden CLI outputs (standalone binary, no Python package)
        shell: bash
        run: |
          bin=$(find build/native -type f \( -name predictive-audit -o -name predictive-audit.exe \) | head -n1)
          python tests/golden/check.py "$bin"

  sanitizers:
    name: sanitizers (${{ matrix.sanitize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure with -fsanitize=${{ matrix.sanitize }} (clang)
        env:
          CXX: clang++
        run: >
          cmake -S native -B build/san -DCMAKE_BUILD_TYPE=Debug
          -DPAUDIT_WERROR=ON -DPAUDIT_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build/san --parallel
      - name: Unit tests
        run: ctest --test-dir build/san --output-on-failure

  build:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quality, test, native]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
