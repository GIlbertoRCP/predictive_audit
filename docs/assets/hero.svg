<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="predictive-audit empirical findings and calibration">
  <defs>
    <style>
      .bg { fill: #fcfcfb; }
      .border { fill: none; stroke: #e1e0d9; stroke-width: 1; }
      .divider { stroke: #e1e0d9; stroke-width: 1; }
      .grid { stroke: #ecebe4; stroke-width: 1; }
      .axis { stroke: #c3c2b7; stroke-width: 1; }
      .title { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
      .sub { font: 400 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6f6d68; }
      .label { font: 400 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52514e; }
      .label-b { font: 600 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
      .tick { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6f6d68; }
      .val { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0b0b0b; }
      .pill-bg { fill: #f0efec; }
      .pill-txt { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0b0b0b; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="339" rx="12" class="bg"/>
  <rect x="0.5" y="0.5" width="879" height="339" rx="12" class="border"/>

  <!-- Top KPI Strip -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="194" height="26" rx="6" class="pill-bg"/>
    <text x="10" y="17" class="pill-txt" fill="#b42d2d">5 of 6 published models FAIL</text>

    <rect x="206" y="0" width="212" height="26" rx="6" class="pill-bg"/>
    <text x="216" y="17" class="pill-txt">28×–100× faster CBB engine</text>

    <rect x="430" y="0" width="196" height="26" rx="6" class="pill-bg"/>
    <text x="440" y="17" class="pill-txt">5.4×–6.2× lower null FPR</text>

    <rect x="638" y="0" width="194" height="26" rx="6" class="pill-bg"/>
    <text x="648" y="17" class="pill-txt">93.7% branch+line coverage</text>
  </g>

  <line x1="24" y1="58" x2="856" y2="58" class="divider"/>
  <line x1="440" y1="70" x2="440" y2="322" class="divider"/>

  <!-- LEFT PANEL: Case 04 (IEEE ICC 2021) Replay Loop RMSE -->
  <g transform="translate(24, 78)">
    <text x="0" y="12" class="title">Case 04 (IEEE ICC 2021): Test RMSE on OD 52</text>
    <text x="0" y="28" class="sub">Lower is better · FFT detects 339-min tcpreplay loop from train only</text>

    <!-- Grid lines (0.00 to 0.12 over x=145..375, width=230) -->
    <line x1="145" y1="48" x2="145" y2="218" class="axis"/>
    <line x1="202.5" y1="48" x2="202.5" y2="218" class="grid"/>
    <line x1="260" y1="48" x2="260" y2="218" class="grid"/>
    <line x1="317.5" y1="48" x2="317.5" y2="218" class="grid"/>
    <line x1="375" y1="48" x2="375" y2="218" class="grid"/>

    <text x="145" y="233" text-anchor="middle" class="tick">0.00</text>
    <text x="202.5" y="233" text-anchor="middle" class="tick">0.03</text>
    <text x="260" y="233" text-anchor="middle" class="tick">0.06</text>
    <text x="317.5" y="233" text-anchor="middle" class="tick">0.09</text>
    <text x="375" y="233" text-anchor="middle" class="tick">0.12</text>

    <!-- Bars: scale = 230 / 0.12 = 1916.67 px per unit -->
    <!-- Seasonal naive 0.035 -> 67.1px -->
    <text x="137" y="70" text-anchor="end" class="label-b">One loop ago (339m)</text>
    <rect x="145" y="57" width="67" height="18" rx="4" fill="#eb6834"/>
    <text x="218" y="70" class="val">0.035</text>

    <!-- BiLSTM 0.085 -> 162.9px -->
    <text x="137" y="106" text-anchor="end" class="label-b">BiLSTM (paper best)</text>
    <rect x="145" y="93" width="163" height="18" rx="4" fill="#2a78d6"/>
    <text x="314" y="106" class="val">0.085 (2.4×)</text>

    <!-- GRU 0.092 -> 176.3px -->
    <text x="137" y="142" text-anchor="end" class="label">GRU</text>
    <rect x="145" y="129" width="176" height="18" rx="4" fill="#2a78d6" opacity="0.78"/>
    <text x="327" y="142" class="val">0.092</text>

    <!-- Vanilla LSTM 0.095 -> 182.1px -->
    <text x="137" y="178" text-anchor="end" class="label">Vanilla LSTM</text>
    <rect x="145" y="165" width="182" height="18" rx="4" fill="#2a78d6" opacity="0.62"/>
    <text x="333" y="178" class="val">0.095</text>

    <!-- Persistence 0.114 -> 218.5px -->
    <text x="137" y="210" text-anchor="end" class="label">Persistence (lag 1)</text>
    <rect x="145" y="197" width="218" height="18" rx="4" fill="#eb6834" opacity="0.55"/>
    <text x="369" y="210" class="val">0.114</text>
  </g>

  <!-- RIGHT PANEL: Monte Carlo Null FPR Calibration -->
  <g transform="translate(464, 78)">
    <text x="0" y="12" class="title">Null False-Positive Rate vs. Autocorrelation φ</text>
    <text x="0" y="28" class="sub">400 Monte Carlo AR(1) trials under H₀ (nominal α = 5%)</text>

    <!-- Legend -->
    <line x1="0" y1="45" x2="14" y2="45" stroke="#b42d2d" stroke-width="2.5"/>
    <text x="19" y="49" class="sub">i.i.d. bootstrap</text>
    <line x1="115" y1="45" x2="129" y2="45" stroke="#2a78d6" stroke-width="2.5"/>
    <text x="134" y="49" class="sub">Politis–White CBB (--block auto)</text>
    <line x1="312" y1="45" x2="326" y2="45" stroke="#006300" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="331" y="49" class="sub">5% target</text>

    <!-- Plot area: x=40..380 (w=340), y=62..218 (h=156 for 0%..100%) -->
    <!-- Y grid: 0%, 25%, 50%, 75%, 100% -->
    <line x1="40" y1="62" x2="380" y2="62" class="grid"/>
    <line x1="40" y1="101" x2="380" y2="101" class="grid"/>
    <line x1="40" y1="140" x2="380" y2="140" class="grid"/>
    <line x1="40" y1="179" x2="380" y2="179" class="grid"/>
    <line x1="40" y1="218" x2="380" y2="218" class="axis"/>

    <!-- Nominal 5% dashed line: y = 218 - 0.05 * 156 = 210.2 -->
    <line x1="40" y1="210.2" x2="380" y2="210.2" stroke="#006300" stroke-width="1.4" stroke-dasharray="4 3"/>

    <text x="34" y="66" text-anchor="end" class="tick">100%</text>
    <text x="34" y="105" text-anchor="end" class="tick">75%</text>
    <text x="34" y="144" text-anchor="end" class="tick">50%</text>
    <text x="34" y="183" text-anchor="end" class="tick">25%</text>
    <text x="34" y="222" text-anchor="end" class="tick">0%</text>

    <!-- X positions for phi = [0.00, 0.70, 0.90, 0.95, 0.98] -> x = [40, 125, 210, 295, 380] -->
    <text x="40" y="233" text-anchor="middle" class="tick">0.00</text>
    <text x="125" y="233" text-anchor="middle" class="tick">0.70</text>
    <text x="210" y="233" text-anchor="middle" class="tick">0.90</text>
    <text x="295" y="233" text-anchor="middle" class="tick">0.95</text>
    <text x="380" y="233" text-anchor="middle" class="tick">0.98</text>

    <!-- i.i.d. FPR: 5.5%, 47.5%, 66.5%, 77.25%, 86.25% -> y = 218 - fpr*156 = [209.4, 143.9, 114.3, 97.5, 83.5] -->
    <polyline fill="none" stroke="#b42d2d" stroke-width="2.5" stroke-linejoin="round"
              points="40,209.4 125,143.9 210,114.3 295,97.5 380,83.5"/>
    <circle cx="40" cy="209.4" r="3.5" fill="#b42d2d"/>
    <circle cx="125" cy="143.9" r="3.5" fill="#b42d2d"/>
    <circle cx="210" cy="114.3" r="3.5" fill="#b42d2d"/>
    <circle cx="295" cy="97.5" r="3.5" fill="#b42d2d"/>
    <circle cx="380" cy="83.5" r="3.5" fill="#b42d2d"/>
    <text x="295" y="88" text-anchor="middle" class="val" fill="#b42d2d">77.2%</text>
    <text x="374" y="75" text-anchor="end" class="val" fill="#b42d2d">86.2%</text>

    <!-- Politis-White CBB FPR: 6.0%, 8.0%, 10.75%, 14.25%, 23.0% -> y = [208.6, 205.5, 201.2, 195.8, 182.1] -->
    <polyline fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"
              points="40,208.6 125,205.5 210,201.2 295,195.8 380,182.1"/>
    <circle cx="40" cy="208.6" r="3.5" fill="#2a78d6"/>
    <circle cx="125" cy="205.5" r="3.5" fill="#2a78d6"/>
    <circle cx="210" cy="201.2" r="3.5" fill="#2a78d6"/>
    <circle cx="295" cy="195.8" r="3.5" fill="#2a78d6"/>
    <circle cx="380" cy="182.1" r="3.5" fill="#2a78d6"/>
    <text x="295" y="187" text-anchor="middle" class="val" fill="#2a78d6">14.2%</text>
    <text x="374" y="173" text-anchor="end" class="val" fill="#2a78d6">23.0%</text>
  </g>
</svg>
